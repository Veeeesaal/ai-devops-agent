services:

  backend:
    build: ./backend
    container_name: ai-backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: ai-frontend

    ports:
      - "3000:3000"

    stdin_open: true
    tty: true

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend